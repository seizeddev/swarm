# Out-of-tree fuzzing crate (cargo-fuzz). It deliberately does NOT depend on the
# `swarm` package: that lib is a cdylib linking WebKit/system frameworks, which
# fails to link under the ASan/fuzzing build. Instead the target #[path]-includes
# the pure parser module (src/osc.rs) directly, so only base64 is pulled in.
[package]
name = "swarm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Must match the version src-tauri uses (osc.rs decodes base64 payloads).
base64 = "0.22"

[[bin]]
name = "parse_notifications"
path = "fuzz_targets/parse_notifications.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
