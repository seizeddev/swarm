[package]
name = "swarm"
version = "0.5.0"
description = "An agentic development environment, built around the terminal — run AI coding agents in parallel, with git and pull requests built in."
authors = ["swarm contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/valewnrt/swarm"
edition = "2021"
rust-version = "1.77"

[lib]
name = "swarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Native (out-of-WebView) clipboard read. The menu "Paste" reads here instead of
# `navigator.clipboard.readText()` — that JS API raises WKWebView's modal DOM-paste
# permission prompt (a second "Paste" button + main-thread stall); reading in the
# native process sidesteps it entirely. (Ctrl+V is unaffected — it's a real paste event.)
tauri-plugin-clipboard-manager = "2"
# Self-update: checks the GitHub release endpoint, downloads + verifies the
# signed artifact, and installs it. `process` provides relaunch() after install.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Git: libgit2 bindings — worktrees, status, diffs, branches. No shelling out to `git`.
git2 = { version = "0.21", default-features = false }
# Cross-platform PTY for streaming agent terminals.
portable-pty = "0.9"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Constant-time byte comparison for PTY sealed-token equality. A `==` on a
# String would let a hostile webview learn the token by timing prefix matches.
subtle = "2"
base64 = "0.22"
dirs = "6"
# Codex hook-trust: SHA-256 of the hook identity (matches Codex's trust scheme) and
# safe TOML editing of its config.toml (features flag + hooks.state trust table).
sha2 = "0.10"
toml = "0.8"
alacritty_terminal = "0.26.0"
# Event-driven filesystem watching (FSEvents/inotify/kqueue) — replaces interval
# polling for agent notifications and live git-status refresh.
notify = "8"
# Repairs $PATH for GUI launches: a bundled .app started from Finder/Dock inherits
# only launchd's minimal PATH, so bare-name agent commands (`claude`, …) aren't found.
# Pulls the login-shell PATH at startup. See tauri-apps/fix-path-env-rs.
fix-path-env = { version = "0.0.0", git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

# Updater is desktop-only (no mobile install path); keep it off Android/iOS builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# We emit native notifications ourselves (instead of tauri-plugin-notification)
# so a click can focus the window + jump to the right pane — no desktop backend
# in the plugin exposes a click callback. Each OS uses its current, non-deprecated
# native API:
#   macOS   — UNUserNotificationCenter (UserNotifications.framework) via objc2,
#             with a delegate for the click. (NOT the deprecated NSUserNotification.)
#   Linux   — notify-rust: a "default" action + wait_for_action (zbus, async).
#   Windows — tauri-winrt-notification: Toast::on_activated callback.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # optimize for size — lightweight binary
panic = "abort"
strip = true

# The crate stays size-optimized, but the hot terminal path (VT parsing + PTY)
# is speed-critical under flooding output, so build just those deps at -O3.
[profile.release.package.alacritty_terminal]
opt-level = 3

[profile.release.package.portable-pty]
opt-level = 3
