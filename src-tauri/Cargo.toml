[package]
name = "swarm"
version = "0.1.0"
description = "Parallel terminals for AI coding agents, with a built-in GitHub view."
authors = ["swarm contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/seizeddev/swarm"
edition = "2021"
rust-version = "1.77"

[lib]
name = "swarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Self-update: checks the GitHub release endpoint, downloads + verifies the
# signed artifact, and installs it. `process` provides relaunch() after install.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Git: libgit2 bindings — worktrees, status, diffs, branches. No shelling out to `git`.
git2 = { version = "0.21", default-features = false }
# Cross-platform PTY for streaming agent terminals.
portable-pty = "0.9"
# Async runtime (Tauri uses it; we use it for spawning blocking PTY readers off-thread).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "6"
alacritty_terminal = "0.26.0"
# Event-driven filesystem watching (FSEvents/inotify/kqueue) — replaces interval
# polling for agent notifications and live git-status refresh.
notify = "8"
# Repairs $PATH for GUI launches: a bundled .app started from Finder/Dock inherits
# only launchd's minimal PATH, so bare-name agent commands (`claude`, …) aren't found.
# Pulls the login-shell PATH at startup. See tauri-apps/fix-path-env-rs.
fix-path-env = { version = "0.0.0", git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

# Updater is desktop-only (no mobile install path); keep it off Android/iOS builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # optimize for size — lightweight binary
panic = "abort"
strip = true

# The crate stays size-optimized, but the hot terminal path (VT parsing + PTY)
# is speed-critical under flooding output, so build just those deps at -O3.
[profile.release.package.alacritty_terminal]
opt-level = 3

[profile.release.package.portable-pty]
opt-level = 3
