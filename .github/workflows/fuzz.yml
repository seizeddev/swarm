name: Fuzz

# Scheduled (not PR-blocking): cargo-fuzz needs nightly + a sanitizer build, so
# it runs weekly and on demand rather than on every push. New crashes surface as
# a failed run with the offending input in the artifacts.
on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz"
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: parse_notifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # cargo-fuzz requires a nightly toolchain (the -Z sanitizer flags). The
      # target #[path]-includes the pure parser (osc.rs) and pulls only base64,
      # so no WebKit/system libs are needed.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz parse_notifications
        working-directory: src-tauri
        run: cargo fuzz run parse_notifications -- -max_total_time=${{ github.event.inputs.max_total_time || '300' }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: src-tauri/fuzz/artifacts/
          if-no-files-found: ignore
