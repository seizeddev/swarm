name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here pushes or writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting gate (parity with `cargo fmt --check` on the Rust side).
      - run: pnpm format:check
      # Unit tests + coverage thresholds (fails the build if coverage regresses).
      - run: pnpm test:coverage
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # generate_context!() embeds ../dist, so the frontend must be built first.
      - run: pnpm build

      # Pinned to the action commit AND a concrete toolchain (the @stable branch
      # is mutable on both axes); bump via Dependabot + a deliberate edit here.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: test
        # Windows-2025 runner images periodically ship an MSVC runtime whose
        # ucrt/vcruntime exports drift against the libtest harness's debug-build
        # imports — `cargo test` then aborts at process load with
        # `STATUS_ENTRYPOINT_NOT_FOUND` (0xc0000139), before any test runs.
        # Linking the CRT statically into the test binary sidesteps the system
        # DLL entirely (release bundles work fine without this).
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml
