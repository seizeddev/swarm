name: Security

# Supply-chain gates: dependency advisories, license/ban policy, and the npm
# audit. Runs on every PR/push to main so a vulnerable or disallowed dependency
# can't merge, plus a weekly schedule to catch newly-disclosed advisories in
# code that hasn't changed.
#
# cargo-deny is the RUSTSEC advisory gate: it audits the same advisory database
# (vulnerabilities + yanked = deny in deny.toml), so a separate cargo-audit job
# would be redundant — and the rustsec/audit-check action additionally fails on
# transitive *unmaintained* advisories (gtk-rs, proc-macro-error, unic, …) that
# have no fix, which deny.toml deliberately tolerates (unmaintained = workspace).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          manifest-path: src-tauri/Cargo.toml
          # all = advisories, bans, licenses, sources (deny.toml governs each).
          command: check all

  pnpm-audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
