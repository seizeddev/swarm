name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; jobs opt in to the scopes they actually need.
permissions:
  contents: read

jobs:
  # One job creates the single draft release up front; every build job then
  # uploads into it via releaseId. This avoids the race where parallel matrix
  # jobs each create their own draft and split the artifacts across releases.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: create draft release
        id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: `swarm ${process.env.GITHUB_REF_NAME}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    # The signing key lives in this protected environment (required reviewers),
    # so it is exposed only to a human-approved run — not to every matrix build
    # by default. Keeps the two-phase create/upload pattern (see CLAUDE.md).
    environment: release
    permissions:
      contents: write # upload release assets
      id-token: write # OIDC token for SLSA provenance signing
      attestations: write # write the provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: ""
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and merges latest.json into the shared
          # release. The private key (from ~/.tauri/swarm.key) and its password
          # are repo secrets, exposed only via the `release` environment above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # SLSA build provenance for every artifact tauri produced, so a consumer
      # can verify (gh attestation verify) the binary came from this workflow at
      # this commit — not a forged upload to the release.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

      # The step above only writes to GitHub's attestation store, which
      # Scorecard's Signed-Releases check can't see — it inspects release
      # *assets*. So also upload the in-toto bundle (SLSA provenance v1) as a
      # *.intoto.jsonl release asset. Asset name is unique per matrix job
      # (os+target) to avoid collisions; --clobber makes reruns idempotent.
      - name: Upload provenance to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash # git-bash on windows-latest too → one script for all 4 matrix OSes
        run: |
          dest="swarm-${{ matrix.os }}-${{ matrix.target || 'default' }}.intoto.jsonl"
          cp "${{ steps.attest.outputs.bundle-path }}" "$dest"
          gh release upload "$GITHUB_REF_NAME" "$dest" --clobber
